name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck install.sh test/bootstrap.test.sh
      - name: test
        run: sh test/bootstrap.test.sh

  # Windows 설치기(install.ps1): 정적 검사, Windows PowerShell 5.1 파서, BOM, WSL 배포판이 없으면 안내로 멈추는지.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize RuleName, Line, Message | Out-String -Width 300
          if ($r) { exit 1 }
      - name: 5.1 파서·BOM
        shell: powershell
        run: |
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path install.ps1))
          if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { "UTF-8 BOM 없음"; exit 1 }
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$e)
          if ($e) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "parse ok ($($PSVersionTable.PSVersion))"
      - name: 배포판이 없으면 설치 안내로 멈춤
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Distro Aivengers-CI-None -DryRun -NoBrowser 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -eq 0) { "0으로 끝남(배포판 없음인데)"; exit 1 }
          if ($out -notmatch 'wsl') { "WSL 안내 없음"; exit 1 }

  # 사용자 Mac과 같은 macOS 기본 bash(3.2)로 돌린다. 리눅스 bash에서 안 보이던 문제(비ASCII 뒤 변수 이름 등)를 잡는다.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test (/bin/bash)
        run: |
          /bin/bash --version | head -n 1
          BOOT_BASH=/bin/bash sh test/bootstrap.test.sh
      - name: 플랫폼 확인을 켠 채 도움말
        run: /bin/bash install.sh --help
